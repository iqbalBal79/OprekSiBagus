<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Si BAGUS - Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.4/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class='modal-overlay active' id='login-overlay' style='background:radial-gradient(circle at 30% 20%,#1a2748,#0b1120)'><div class='modal' style='max-width:360px;text-align:center'><div class='modal-body'><div class='logo-icon' style='margin:0 auto 15px;width:56px;height:56px'><i data-lucide="lock" style="width:26px;height:26px"></i></div><h2 style='margin-bottom:6px;color:var(--text)'>Si BAGUS</h2><p style='color:var(--text-mute);font-size:13px;margin-bottom:20px'>Masukkan PIN Admin untuk masuk</p><input type='password' class='form-input' id='admin-pin-input' placeholder='PIN Admin' style='text-align:center;letter-spacing:4px;margin-bottom:12px' onkeydown='if(event.key==="Enter")doAdminLogin()'><button class='btn btn-primary' style='width:100%;justify-content:center' onclick='doAdminLogin()'>Masuk</button><p id='login-err' style='color:var(--danger);font-size:12px;margin-top:10px'></p></div></div></div><div class='app' id='app-root' style='display:none'><aside class='sidebar'><div class='sidebar-header'><div class='logo-icon'><i data-lucide='graduation-cap' style='width:22px;height:22px'></i></div><div class='logo-text'><h1>Si BAGUS</h1><p>Admin Portal</p></div></div><nav class='nav'><div class='nav-item active' data-page='dashboard' onclick='showPage("dashboard")'><i data-lucide='home'></i><span>Dashboard</span></div><div class='nav-item' data-page='laporan' onclick='showPage("laporan")'><i data-lucide='clipboard-check'></i><span>Laporan Kehadiran</span></div><div class='nav-item' data-page='rekap' onclick='showPage("rekap")'><i data-lucide='calendar-range'></i><span>Rekap Bulanan</span></div><div class='nav-item' data-page='siswa' onclick='showPage("siswa")'><i data-lucide='users'></i><span>Daftar Siswa</span></div><div class='nav-item' data-page='pengaturan' onclick='showPage("pengaturan")'><i data-lucide='settings'></i><span>Pengaturan</span></div></nav><div class='sidebar-footer'><div class='user'><div class='user-avatar'>BS</div><div class='user-info'>Muhammad Iqbal<p>Administrator</p></div></div></div></aside><main class='main'><div class='topbar'><div style='display:flex;align-items:center;gap:12px'><button class='mobile-menu-btn' onclick='toggleSidebar()'><i data-lucide='menu' style='width:22px;height:22px'></i></button><h2 id='page-title'>Dashboard</h2></div><div class='topbar-right'><div class='search-box'><i data-lucide='search' style='width:16px;color:var(--text-mute)'></i><input type='text' placeholder='Cari nama siswa...'></div><div class='topbar-icon'><i data-lucide='bell' style='width:20px'></i></div><div class='topbar-icon'><i data-lucide='message-square' style='width:20px'></i></div></div></div><div class='content' id='main-content'></div></main><div class='sidebar-backdrop' id='sidebar-backdrop' onclick='toggleSidebar()'></div></div><div class='modal-overlay' id='modal'></div><div class='toast-container' id='toasts'></div>
<script src="gas-shim.js"></script>
<script src="app-admin.js"></script>
</body>
</html>
